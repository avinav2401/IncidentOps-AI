services:
  # The Backend API (FastAPI)
  - type: web
    name: incidentops-backend
    env: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    region: ohio
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: incidentops-db
          property: connectionString
      - key: DEMO_MODE
        value: "true"
      - key: APP_ENV
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false

  # The Frontend (Next.js)
  - type: web
    name: incidentops-frontend
    env: docker
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    region: ohio
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: incidentops-backend
          envVarKey: RENDER_EXTERNAL_URL

databases:
  # Managed PostgreSQL Database
  - name: incidentops-db
    region: ohio
    plan: free
    databaseName: incidentops
    user: incidentops_admin
